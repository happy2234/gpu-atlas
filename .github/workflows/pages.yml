name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install build dependencies
        run: npm install --no-audit --no-fund
      - name: Build static pages, guides, images and sitemap
        run: node scripts/build.cjs
        env:
          SITE_URL: https://gpuatlas.in
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Separate job: the upload is registered before publishing starts, and
    # "Re-run failed jobs" retries only this step with the same upload.
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check custom domain
        continue-on-error: true
        run: |
          echo "A records:"; dig +short A gpuatlas.in @8.8.8.8
          echo "www:"; dig +short CNAME www.gpuatlas.in @8.8.8.8
          echo "HTTP:"; curl -sI http://gpuatlas.in | head -5
          echo "HTTPS:"; curl -sI https://gpuatlas.in 2>&1 | head -5 || true
          curl -sv https://gpuatlas.in -o /dev/null 2>&1 | grep -iE "subject:|issuer:|SSL certificate problem|no alternative" | head -3
      - name: Notify Bing and Yandex (IndexNow)
        continue-on-error: true
        run: |
          sleep 60
          URLS=$(curl -s https://gpuatlas.in/sitemap.xml | grep -o '<loc>[^<]*</loc>' | sed 's#</\?loc>##g' | head -10000 | jq -R . | jq -s .)
          if [ "$URLS" = "[]" ] || [ -z "$URLS" ]; then echo "Sitemap not reachable at gpuatlas.in yet; skipping"; exit 0; fi
          jq -n --argjson urls "$URLS" '{host:"gpuatlas.in", key:"5f3c9a1e7b2d4c8a9e6f0b1d2c3a4e5f", keyLocation:"https://gpuatlas.in/5f3c9a1e7b2d4c8a9e6f0b1d2c3a4e5f.txt", urlList:$urls}' > indexnow.json
          curl -s -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow -H "Content-Type: application/json; charset=utf-8" --data @indexnow.json
